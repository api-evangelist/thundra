aid: thundra
name: Thundra
description: Thundra was an application observability and security platform for serverless,
  container, and VM workloads, best known for AWS Lambda monitoring and debugging. Its
  products included Thundra APM (distributed tracing), Sidekick (remote debugging), and
  Foresight (CI pipeline test observability). Founded in 2018 out of OpsGenie and backed
  by Battery Ventures, its assets were acquired by Catchpoint in April 2023 and the
  service has been discontinued — thundra.io now redirects to Catchpoint's acquisition
  announcement and the GitHub organization states "Thundra is no longer in service."
  Its open-source agents and plugins remain published on npm, PyPI, Maven Central,
  NuGet, and pkg.go.dev.
